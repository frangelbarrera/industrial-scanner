name: Dependency scan (daily)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies
        shell: bash
        run: |
          set -o pipefail
          pip-audit -r requirements.txt --strict 2>&1 | tee pip-audit-output.txt
      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "[Security] Dependency audit failed"
          content-filepath: ./pip-audit-output.txt
