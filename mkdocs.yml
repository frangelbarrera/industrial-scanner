# IndustrialScanner documentation site (MkDocs Material)

site_name: IndustrialScanner
site_description: Read-only security analyzer for ICS/OT — Modbus/TCP, Siemens S7Comm, DNP3
site_url: https://frangelbarrera.github.io/IndustrialScanner/
repo_url: https://github.com/frangelbarrera/industrial-scanner
repo_name: frangelbarrera/industrial-scanner
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Protocols:
      - Modbus/TCP: protocols/modbus.md
      - Siemens S7Comm: protocols/s7comm.md
      - DNP3: protocols/dnp3.md
  - MITRE ATT&CK: mitre-attack.md
  - IEC 62443: 62443-zones-conduits.md
  - Architecture: architecture.md
  - Security: security.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/frangelbarrera/industrial-scanner
